# The container port the load balancer and the ECS task definition target.
server.port=8080

# Expose the health endpoint over HTTP: this is what the Application Load Balancer health check
# calls, and it is the only Actuator endpoint that is reachable.
management.endpoints.web.exposure.include=health

# Do not leak component details (disk space, etc.) on an endpoint that is publicly reachable.
management.endpoint.health.show-details=never

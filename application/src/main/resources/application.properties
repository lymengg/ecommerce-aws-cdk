# The container port the load balancer and the ECS task definition target.
server.port=8080

# Expose the health endpoint over HTTP: this is what the Application Load Balancer health check
# calls, and it is the only Actuator endpoint that is reachable.
management.endpoints.web.exposure.include=health

# Do not leak component details (disk space, database, etc.) on an endpoint that is publicly
# reachable. The overall status is enough: UP means the database is reachable too.
management.endpoint.health.show-details=never

# ---------------------------------------------------------------------------
# Data tier (Phase 3)
# ---------------------------------------------------------------------------
# Everything below is supplied by the environment, never written down here:
#
#   DB_HOST, DB_PORT, DB_NAME  plain environment variables set by the ECS task definition
#   DB_USERNAME, DB_PASSWORD   injected by ECS from the Secrets Manager secret at container start
#
# There is deliberately no default for the credentials. A missing DB_USERNAME fails the container
# with "Could not resolve placeholder", which is exactly what should happen: the application must
# never fall back to a built-in user or an empty password.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ecommerce}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Flyway owns the schema (src/main/resources/db/migration). Hibernate only validates that the
# entities match what Flyway created, so a drift between the two fails the deployment instead of the
# first query at runtime. ddl-auto is never `update` here: the application must not change tables.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate

# Do not keep a database connection open for the whole request. The service layer opens the
# transactions it needs; holding a connection through response rendering only exhausts the pool.
spring.jpa.open-in-view=false

# Timestamps need no time zone property: the entity uses java.time.Instant, which Hibernate maps to
# `timestamptz`. Setting `hibernate.jdbc.time_zone` would be actively harmful here - it makes
# Hibernate reinterpret a local date-time using the JVM's zone, which silently shifts stored values.

# A small pool is enough for the request rate this phase handles, and it keeps the connection count
# well below the instance's max_connections.
spring.datasource.hikari.maximum-pool-size=10

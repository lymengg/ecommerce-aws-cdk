# The container port the load balancer and the ECS task definition target.
server.port=8080

# Expose the health endpoint over HTTP: this is what the Application Load Balancer health check
# calls, and it is the only Actuator endpoint that is reachable.
management.endpoints.web.exposure.include=health

# Do not leak component details (disk space, database, etc.) on an endpoint that is publicly
# reachable. The overall status is enough: UP means the database is reachable too.
management.endpoint.health.show-details=never

# ---------------------------------------------------------------------------
# Data tier (Phase 3)
# ---------------------------------------------------------------------------
# Everything below is supplied by the environment, never written down here:
#
#   DB_HOST, DB_PORT, DB_NAME  plain environment variables set by the ECS task definition
#   DB_USERNAME, DB_PASSWORD   injected by ECS from the Secrets Manager secret at container start
#
# There is deliberately no default for the credentials. A missing DB_USERNAME fails the container
# with "Could not resolve placeholder", which is exactly what should happen: the application must
# never fall back to a built-in user or an empty password.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ecommerce}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Flyway owns the schema (src/main/resources/db/migration). Hibernate only validates that the
# entities match what Flyway created, so a drift between the two fails the deployment instead of the
# first query at runtime. ddl-auto is never `update` here: the application must not change tables.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate

# Do not keep a database connection open for the whole request. The service layer opens the
# transactions it needs; holding a connection through response rendering only exhausts the pool.
spring.jpa.open-in-view=false

# Timestamps need no time zone property: the entity uses java.time.Instant, which Hibernate maps to
# `timestamptz`. Setting `hibernate.jdbc.time_zone` would be actively harmful here - it makes
# Hibernate reinterpret a local date-time using the JVM's zone, which silently shifts stored values.

# A small pool is enough for the request rate this phase handles, and it keeps the connection count
# well below the instance's max_connections.
spring.datasource.hikari.maximum-pool-size=10

# ---------------------------------------------------------------------------
# Authentication (Phase 4) - the Backend for Frontend
# ---------------------------------------------------------------------------
# The application is the OAuth client; the browser never receives a token and never talks to
# Cognito directly. Everything below comes from the environment with NO default, exactly like the
# database credentials, so a missing value fails the container at start rather than falling back to
# something insecure:
#
#   COGNITO_ISSUER_URI     OIDC issuer of the user pool (discovery + ID token validation)
#   COGNITO_CLIENT_ID      public id of the confidential app client
#   COGNITO_CLIENT_SECRET  injected by ECS from Secrets Manager, never a literal here or in an image
#   FRONTEND_URL           the SPA's URL: the OAuth2 login-success and post-logout landing
#   CORS_ALLOWED_ORIGINS   comma-separated exact frontend origins (never "*")
#   SESSION_TIMEOUT        BFF session lifetime, an ISO-8601 duration such as PT30M
#
# The provider is configured by issuer URI, so the endpoints and the JWK set are discovered and the
# ID token signature is always verified against Cognito's keys - the algorithm is never trusted from
# the token itself.
spring.security.oauth2.client.registration.cognito.client-id=${COGNITO_CLIENT_ID}
spring.security.oauth2.client.registration.cognito.client-secret=${COGNITO_CLIENT_SECRET}
spring.security.oauth2.client.registration.cognito.scope=openid,email,profile
spring.security.oauth2.client.registration.cognito.authorization-grant-type=authorization_code
# {baseUrl} is the application's own base URL, which must match a registered callback URI exactly.
spring.security.oauth2.client.registration.cognito.redirect-uri={baseUrl}/login/oauth2/code/cognito
spring.security.oauth2.client.provider.cognito.issuer-uri=${COGNITO_ISSUER_URI}
# The attribute Spring reads to name the principal, from the **UserInfo response** - not from the ID
# token. Cognito's /oauth2/userInfo returns the standard `username` claim; `cognito:username` exists
# only in the ID token, so configuring it here makes the login fail with "Attribute value for
# 'cognito:username' cannot be null" and bounce the browser through /login?error in a redirect loop.
spring.security.oauth2.client.provider.cognito.user-name-attribute=username

# The SPA's URL. Spring Security redirects the browser here after a successful login (the default
# would be the API root, which serves no page), and here again after RP-initiated logout; it must be
# one of the app client's registered logout URIs.
app.auth.frontend-url=${FRONTEND_URL}

# Exact frontend origins for CORS. The API answers with credentials, so a wildcard is never valid.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# The load balancer terminates TLS and forwards over plain HTTP with X-Forwarded-* headers. Without
# this the redirect URI would be built as http://... and would not match the registered HTTPS
# callback, and the session cookie would not be marked Secure.
server.forward-headers-strategy=framework

# The BFF's own session. It is httpOnly (a script cannot read it), Secure (only sent over HTTPS) and
# SameSite=Lax (not attached to cross-site requests). SameSite=Lax, rather than Strict, is deliberate:
# Strict would drop the cookie on the top-level navigation back from Cognito, breaking login.
#
# The __Host- prefix is the strongest cookie scope the platform offers: it binds the cookie to this
# exact host, forbids a Domain attribute, and requires Secure with Path=/. That stops a sibling
# subdomain (api.<env-domain>) from setting a cookie this service would accept - session fixation /
# "cookie tossing". It requires Secure, so local HTTP development overrides both the name and Secure
# (SESSION_COOKIE_NAME=SESSION, SESSION_COOKIE_SECURE=false); deployed environments leave the
# defaults alone.
server.servlet.session.timeout=${SESSION_TIMEOUT}
server.servlet.session.cookie.name=${SESSION_COOKIE_NAME:__Host-SESSION}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=lax
